name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # Both commands read the plugin locally and need no account. Each mod is checked on its own.
      - name: Validate the cockpit
        run: claude plugin validate cockpit

      - name: Test the cockpit
        run: claude plugin test cockpit

      - name: Validate the rollover mod
        run: claude plugin validate rollover

      - name: Test the rollover mod
        run: claude plugin test rollover
